<vbox class="wechat-importer-settings"
      onload="WeChatImporterPreferences.init();"
      xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">
  <html:style><![CDATA[
    .wechat-importer-settings { padding: 4px 2px 18px; }
    .wechat-importer-card {
      padding: 12px 16px 18px;
      border: 1px solid var(--material-border, #d6d9df);
      border-radius: 9px;
      background: var(--material-background, #fff);
    }
    .wechat-importer-card h2 { margin: 0 0 5px; font-size: 1.2em; }
    .wechat-importer-card p { margin: 5px 0 12px; line-height: 1.4; }
    .wechat-importer-field { margin: 10px 0; }
    .wechat-importer-field label { min-width: 6em; }
    .wechat-importer-field input, .wechat-importer-field select {
      box-sizing: border-box;
      min-height: 28px;
      padding: 4px 8px;
      border: 1px solid var(--material-border, #c8ccd2);
      border-radius: 5px;
    }
    .wechat-importer-field input { width: min(38em, 75%); }
    #wechat-importer-provider { width: 12em; }
    .wechat-importer-provider { margin: 12px 0; }
    .wechat-importer-provider h3 { margin: 8px 0; font-size: 1em; }
    .wechat-importer-actions { margin-top: 12px; }
    .wechat-importer-note { color: var(--fill-secondary, #5f6368); font-size: .9em; }
    #wechat-importer-test-status { margin-left: 8px; }
    .wechat-importer-about { margin-top: 10px; }
    .wechat-importer-about p { margin: 4px 0; }
  ]]></html:style>

  <vbox class="wechat-importer-card">
    <html:h2>AI 模型设置</html:h2>
    <html:h3>文献线索识别模型</html:h3>
    <html:p>选择用于分析微信公众号正文的服务。每个服务分别保存 API Key、API 地址和模型名。</html:p>
    <hbox class="wechat-importer-field" align="center">
      <label value="当前服务" control="wechat-importer-provider"/>
      <html:select id="wechat-importer-provider" preference="extensions.zotero-wechat-importer.provider"
                   onchange="WeChatImporterPreferences.updateProviderVisibility();">
        <html:option value="deepseek">DeepSeek</html:option>
        <html:option value="qwen">Qwen（通义千问）</html:option>
        <html:option value="zhipu">智谱 GLM</html:option>
        <html:option value="mimo">MiMo（小米）</html:option>
      </html:select>
    </hbox>

    <vbox id="wechat-importer-deepseek-settings" class="wechat-importer-provider">
      <html:h3>DeepSeek</html:h3>
      <hbox class="wechat-importer-field" align="center"><label value="API Key" control="wechat-importer-deepseek-api-key"/><html:input id="wechat-importer-deepseek-api-key" type="password" autocomplete="off" preference="extensions.zotero-wechat-importer.deepseek.apiKey"/></hbox>
      <hbox class="wechat-importer-field" align="center"><label value="API 地址" control="wechat-importer-deepseek-base-url"/><html:input id="wechat-importer-deepseek-base-url" type="url" preference="extensions.zotero-wechat-importer.deepseek.baseURL"/></hbox>
      <hbox class="wechat-importer-field" align="center"><label value="模型" control="wechat-importer-deepseek-model"/><html:input id="wechat-importer-deepseek-model" type="text" preference="extensions.zotero-wechat-importer.deepseek.model"/></hbox>
    </vbox>
    <vbox id="wechat-importer-qwen-settings" class="wechat-importer-provider" hidden="true">
      <html:h3>Qwen（阿里云百炼）</html:h3>
      <hbox class="wechat-importer-field" align="center"><label value="API Key" control="wechat-importer-qwen-api-key"/><html:input id="wechat-importer-qwen-api-key" type="password" autocomplete="off" preference="extensions.zotero-wechat-importer.qwen.apiKey"/></hbox>
      <hbox class="wechat-importer-field" align="center"><label value="API 地址" control="wechat-importer-qwen-base-url"/><html:input id="wechat-importer-qwen-base-url" type="url" preference="extensions.zotero-wechat-importer.qwen.baseURL"/></hbox>
      <hbox class="wechat-importer-field" align="center"><label value="模型" control="wechat-importer-qwen-model"/><html:input id="wechat-importer-qwen-model" type="text" preference="extensions.zotero-wechat-importer.qwen.model"/></hbox>
      <html:p class="wechat-importer-note">如使用百炼专属 Workspace 地址，可在这里修改。</html:p>
    </vbox>
    <vbox id="wechat-importer-zhipu-settings" class="wechat-importer-provider" hidden="true">
      <html:h3>智谱 GLM</html:h3>
      <hbox class="wechat-importer-field" align="center"><label value="API Key" control="wechat-importer-zhipu-api-key"/><html:input id="wechat-importer-zhipu-api-key" type="password" autocomplete="off" preference="extensions.zotero-wechat-importer.zhipu.apiKey"/></hbox>
      <hbox class="wechat-importer-field" align="center"><label value="API 地址" control="wechat-importer-zhipu-base-url"/><html:input id="wechat-importer-zhipu-base-url" type="url" preference="extensions.zotero-wechat-importer.zhipu.baseURL"/></hbox>
      <hbox class="wechat-importer-field" align="center"><label value="模型" control="wechat-importer-zhipu-model"/><html:input id="wechat-importer-zhipu-model" type="text" preference="extensions.zotero-wechat-importer.zhipu.model"/></hbox>
    </vbox>
    <vbox id="wechat-importer-mimo-settings" class="wechat-importer-provider" hidden="true">
      <html:h3>MiMo（小米）</html:h3>
      <hbox class="wechat-importer-field" align="center"><label value="API Key" control="wechat-importer-mimo-api-key"/><html:input id="wechat-importer-mimo-api-key" type="password" autocomplete="off" preference="extensions.zotero-wechat-importer.mimo.apiKey"/></hbox>
      <hbox class="wechat-importer-field" align="center"><label value="API 地址" control="wechat-importer-mimo-base-url"/><html:input id="wechat-importer-mimo-base-url" type="url" preference="extensions.zotero-wechat-importer.mimo.baseURL"/></hbox>
      <hbox class="wechat-importer-field" align="center"><label value="模型" control="wechat-importer-mimo-model"/><html:input id="wechat-importer-mimo-model" type="text" preference="extensions.zotero-wechat-importer.mimo.model"/></hbox>
      <html:p class="wechat-importer-note">Token Plan 可填写套餐提供的专属 API 地址和 Key。</html:p>
    </vbox>

    <hbox class="wechat-importer-actions" align="center">
      <button id="wechat-importer-test-button" label="测试当前模型连接" oncommand="WeChatImporterPreferences.testConnection();"/>
      <html:span id="wechat-importer-test-status" role="status"/>
    </hbox>
    <html:p class="wechat-importer-note">API Key 以明文保存在本机 Zotero 首选项中。不要在共享设备上保存个人 Key。</html:p>
  </vbox>

  <vbox class="wechat-importer-card wechat-importer-about">
    <html:h2>关于</html:h2>
    <html:p>WeChat Papers · 0.2.1</html:p>
    <html:p>从微信公众号文章识别论文线索，经 PubMed / Crossref 核验后导入 Zotero，并查找可用全文。</html:p>
    <html:p>项目仓库：<html:a href="https://github.com/nkbaim/zotero-wechat-importer" target="_blank" onclick="WeChatImporterPreferences.openExternalLink(event);">github.com/nkbaim/zotero-wechat-importer</html:a></html:p>
    <html:p>
      <html:a href="https://github.com/nkbaim/zotero-wechat-importer/releases" target="_blank" onclick="WeChatImporterPreferences.openExternalLink(event);">版本发布</html:a>
      · <html:a href="https://github.com/nkbaim/zotero-wechat-importer/issues" target="_blank" onclick="WeChatImporterPreferences.openExternalLink(event);">问题反馈</html:a>
      · <html:a href="https://github.com/nkbaim/zotero-wechat-importer/blob/main/LICENSE" target="_blank" onclick="WeChatImporterPreferences.openExternalLink(event);">MIT License</html:a>
    </html:p>
  </vbox>
</vbox>
